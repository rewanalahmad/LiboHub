{% extends "base.html" %}
{% load django_bootstrap5 %}
{% block page_header%} 
    <h2> Add Product </h2>
{%endblock page_header%}

{% block content %}
    <div>
        <form method="post">
            {% csrf_token%}
            {% bootstrap_form form%}
            {% bootstrap_button button_type='submit' content='save' %}
        </form>
    </div>
{% endblock %}
